<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Silsila data flow: your files are read by parsers inside the browser tab and drawn as views; nothing is uploaded">
<style>
text{font:14px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.s{font-size:12px;fill:#59636e}.h{font-weight:600}
.b{fill:none;stroke:#8c959f;stroke-width:1.5}.a{fill:none;stroke:#0969da;stroke-width:2}.k{fill:none;stroke:#0969da;stroke-width:1.5;stroke-dasharray:6 5}
.c{fill:#0969da;fill-opacity:.08;stroke:#0969da;stroke-width:1.5}.m{fill:#0969da}.t{fill:#0969da;font-size:12px;font-weight:600;letter-spacing:.06em}
@media (prefers-color-scheme:dark){text{fill:#e6edf3}.s{fill:#9198a1}.b{stroke:#6e7681}.a,.k{stroke:#4493f8}.c{fill:#4493f8;stroke:#4493f8;fill-opacity:.12}.m,.t{fill:#4493f8}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="k" x="10" y="14" width="700" height="372" rx="14"/>
<text class="t" x="30" y="42">YOUR BROWSER TAB</text>
<rect class="b" x="30" y="128" width="190" height="72" rx="8"/><text class="h" x="46" y="156">Your raw DNA files</text><text class="s" x="46" y="176">.csv .txt .zip .gz</text><text class="s" x="46" y="192">from 5 companies</text>
<rect class="b" x="30" y="250" width="190" height="72" rx="8"/><text class="h" x="46" y="278">Reference data</text><text class="s" x="46" y="298">Y tree, ancient samples,</text><text class="s" x="46" y="314">same folder as the page</text>
<path class="a" d="M220 164L276 164" marker-end="url(#ar)"/>
<rect class="c" x="280" y="128" width="170" height="72" rx="10"/><text class="h" x="365" y="158" text-anchor="middle">Parsers</text><text class="s" x="365" y="178" text-anchor="middle">js/genome.js</text>
<path class="a" d="M450 150C490 150 490 76 526 76" marker-end="url(#ar)"/>
<path class="a" d="M450 160C490 160 490 140 526 140" marker-end="url(#ar)"/>
<path class="a" d="M450 170C490 170 490 204 526 204" marker-end="url(#ar)"/>
<path class="a" d="M450 180C490 180 490 268 526 268" marker-end="url(#ar)"/>
<path class="a" d="M220 286C380 286 470 300 526 300" marker-end="url(#ar)"/>
<rect class="b" x="530" y="52" width="160" height="48" rx="8"/><text class="h" x="546" y="81">Net and Timeline</text>
<rect class="b" x="530" y="116" width="160" height="48" rx="8"/><text class="h" x="546" y="145">Map</text>
<rect class="b" x="530" y="180" width="160" height="48" rx="8"/><text class="h" x="546" y="209">Genome</text>
<rect class="b" x="530" y="244" width="160" height="72" rx="8"/><text class="h" x="546" y="273">Database</text><text class="s" x="546" y="293">every table, as CSV</text>
<text class="s" x="30" y="364">Local storage keeps your Y calls and summaries, never your autosomal genotypes.</text>
<rect class="b" x="740" y="150" width="140" height="96" rx="8"/><text class="h" x="810" y="180" text-anchor="middle">Any server</text><text class="s" x="810" y="204" text-anchor="middle">receives</text><text class="h" x="810" y="226" text-anchor="middle">nothing</text>
<path class="b" d="M690 198L736 198" style="stroke-dasharray:4 4"/>
<path class="a" d="M704 188l12 20M716 188l-12 20"/>
</svg>
